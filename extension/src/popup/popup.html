<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bulk Buddy for Notion</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Bulk Buddy for Notion</h1>
        <p class="app__subtitle">Connection spike (dev)</p>
      </header>

      <label class="field" for="token">
        <span class="field__label">Notion integration token</span>
        <input
          id="token"
          class="field__input"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="secret_..."
        />
      </label>

      <div class="actions">
        <button id="save" class="btn btn--secondary" type="button">Save token</button>
        <button id="test" class="btn btn--primary" type="button">Test connection</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
