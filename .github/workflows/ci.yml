name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  extension:
    name: extension — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install (clean)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  oauth-worker:
    name: oauth-worker — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oauth-worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The worker has no dependencies (pure node:test), so no install step.
      - name: Test
        run: npm test
